plugins { id 'com.android.application' }

android { namespace 'com.fastbrowser.pc'; compileSdk 36
    defaultConfig { applicationId 'com.fastbrowser.pc'; minSdk 24; targetSdk 35; versionCode 2; versionName '1.1' }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
    implementation 'androidx.webkit:webkit:1.17.1'
}
